  build-linux:
    needs: build-prepare
    runs-on: ${{ fromJSON(inputs.build_runs_on) }}
    container:
      image: ${{ inputs.build_packager_image }}
    name: Build on Linux
    if: contains(needs.build-prepare.outputs.runner_os, 'Linux')
    env:
      VERACODE_API_KEY_ID: '${{ secrets.VERACODE_API_ID }}'
      VERACODE_API_KEY_SECRET: '${{ secrets.VERACODE_API_KEY }}'

    steps:
      - name: Install git-lfs in container
        run: |
          apt-get update
          apt-get install -y git-lfs
          git lfs install

      - uses: actions/checkout@v6
        with:
          path: 'veracode-helper'
          lfs: true

      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.token }}
          path: 'source-code'
          lfs: true

      - name: Package the application
        id: application_package_linux
        # ... rest of the steps remain the same
